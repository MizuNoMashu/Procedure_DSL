<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedure Extractor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: monospace; max-width: 960px; margin: 0 auto; padding: 0 24px 40px; color: #222; }
    nav {
      display: flex; border-bottom: 2px solid #333;
      margin-bottom: 24px; padding-top: 16px;
    }
    nav a {
      text-decoration: none; color: #666;
      padding: 8px 18px; font-family: monospace; font-size: 0.9rem;
    }
    nav a.active { color: #222; font-weight: bold; border-bottom: 3px solid #333; margin-bottom: -2px; }
    nav a:hover:not(.active) { color: #333; background: #f5f5f5; }
    h1 { font-size: 1.4rem; margin-bottom: 24px; }
    h2 { font-size: 1rem; margin-bottom: 8px; }

    #drop-zone {
      border: 2px dashed #aaa;
      border-radius: 6px;
      padding: 36px;
      text-align: center;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    #drop-zone.over { border-color: #333; background: #f5f5f5; }
    #drop-zone p { color: #666; margin-bottom: 12px; }

    button {
      padding: 8px 18px;
      cursor: pointer;
      border: 1px solid #555;
      border-radius: 4px;
      background: #fff;
      font-family: monospace;
      font-size: 0.9rem;
    }
    button:hover:not(:disabled) { background: #eee; }
    button:disabled { opacity: 0.45; cursor: default; }
    button.primary { background: #333; color: #fff; border-color: #333; }
    button.primary:hover:not(:disabled) { background: #555; }

    .row { display: flex; gap: 8px; margin-top: 16px; align-items: center; flex-wrap: wrap; }
    #file-label { font-weight: bold; color: #333; }

    #status { margin-top: 12px; color: #555; font-size: 0.9rem; min-height: 1.2em; }
    #error { color: #c00; margin-top: 8px; font-size: 0.9rem; min-height: 1.2em; }

    #results { margin-top: 28px; display: none; }
    #steps-pre {
      background: #f4f4f4;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 16px;
      font-size: 0.8rem;
      max-height: 420px;
      overflow: auto;
      white-space: pre;
    }
    .badge {
      display: inline-block;
      background: #333;
      color: #fff;
      border-radius: 10px;
      padding: 1px 8px;
      font-size: 0.8rem;
      margin-left: 6px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 8px;
      margin-bottom: 16px;
    }
    .stat-card {
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 10px;
      text-align: center;
    }
    .stat-card .val { font-size: 1.5rem; font-weight: bold; }
    .stat-card .lbl { font-size: 0.75rem; color: #666; margin-top: 2px; }
  </style>
</head>
<body>

<nav>
  <a href="/" class="active">Extractor</a>
  <a href="/editor">Editor</a>
</nav>

<h1>Procedure Extractor</h1>

<div id="drop-zone">
  <p>Drop a PDF, DOCX, or TXT file here</p>
  <button onclick="document.getElementById('file-input').click()">Choose File</button>
  <input type="file" id="file-input" accept=".pdf,.docx,.txt" style="display:none">
</div>

<div class="row">
  <span id="file-label"></span>
</div>

<div class="row">
  <button id="btn-extract" class="primary" disabled onclick="runExtract()">Extract &amp; Download CSV</button>
</div>

<div id="status"></div>
<div id="error"></div>

<div id="results">
  <div class="stats-grid" id="stats-grid"></div>
  <h2>Steps <span class="badge" id="step-count">0</span></h2>
  <pre id="steps-pre"></pre>
</div>

<script>
  let file = null;

  const dropZone = document.getElementById('drop-zone');
  const fileInput = document.getElementById('file-input');

  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('over');
    setFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', () => setFile(fileInput.files[0]));

  function setFile(f) {
    file = f;
    document.getElementById('file-label').textContent = f ? '📄 ' + f.name : '';
    document.getElementById('btn-extract').disabled = !f;
    clearMessages();
    document.getElementById('results').style.display = 'none';
  }

  function setStatus(msg) { document.getElementById('status').textContent = msg; }
  function showError(msg) { document.getElementById('error').textContent = '⚠ ' + msg; }
  function clearMessages() {
    document.getElementById('status').textContent = '';
    document.getElementById('error').textContent = '';
  }

  function renderStats(stats) {
    if (!stats) return;
    const labels = {
      num_chunks: 'Chunks total',
      num_chunks_processed: 'Chunks used',
      num_steps_raw: 'Steps raw',
      num_steps_invalid: 'Steps invalid',
      num_steps_refined: 'Steps refined',
      num_steps_valid: 'Steps valid',
    };
    const grid = document.getElementById('stats-grid');
    grid.innerHTML = Object.entries(labels).map(([k, l]) =>
      `<div class="stat-card"><div class="val">${stats[k] ?? '-'}</div><div class="lbl">${l}</div></div>`
    ).join('');
  }

  function renderSteps(steps) {
    document.getElementById('step-count').textContent = steps.length;
    document.getElementById('steps-pre').textContent = JSON.stringify(steps, null, 2);
    document.getElementById('results').style.display = '';
  }

  async function runExtract() {
    if (!file) return;
    clearMessages();
    setStatus('⏳ Extracting… this may take several minutes.');
    document.getElementById('results').style.display = 'none';

    const fd = new FormData();
    fd.append('file', file);

    try {
      const resp = await fetch('/extract-csv', { method: 'POST', body: fd });
      const data = await resp.json();
      setStatus('');
      if (!resp.ok) { showError(data.error || 'Extraction failed'); return; }
      renderStats(data.stats);
      renderSteps(data.steps || []);
      setStatus(`✓ Done — ${(data.steps || []).length} steps extracted. Downloading CSV…`);
      if (data.download_url) {
        setTimeout(() => { window.location.href = data.download_url; }, 500);
      }
    } catch (err) {
      setStatus('');
      showError('Network error: ' + err.message);
    }
  }
</script>
</body>
</html>
