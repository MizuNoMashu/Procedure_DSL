device: cuda

llm:
  model: Qwen/Qwen2.5-7B-Instruct  # Ottimo bilancio precisione/velocità (~7B parametri, ~7GB RAM)
  max_tokens: 2048

chunking:
  size: 1000
  overlap: 100

extraction:
  min_confidence: 0.5   # steps below this are flagged invalid
  refine_invalid: true  # run a second LLM pass on invalid steps

