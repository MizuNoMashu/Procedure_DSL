services:
  ui:
    build:
      context: ./ui_dsl
      dockerfile: Dockerfile
    container_name: procedure-ui
    environment:
      - LLM_SERVICE_URL=http://extractor:8001
      - COBOT_SERVICE_URL=http://cobot:5000
    volumes:
      - ./ui_dsl/src:/app/src
    ports:
      - "8000:8000"
    depends_on:
      - extractor

  extractor:
    build:
      context: ./extractor_pipeline
      dockerfile: Dockerfile
    container_name: procedure-extractor
    runtime: nvidia
    environment:
      - HF_HOME=/app/src/models/cache
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ./extractor_pipeline/src:/app/src
    ports:
      - "8001:8001"

  cobot:
    build:
      context: ./cobot
      dockerfile: Dockerfile
    container_name: procedure-cobot
    environment:
      - FRANKA_ROBOT_IP=${FRANKA_ROBOT_IP:-172.16.0.3}
      - HOST=0.0.0.0
      - PORT=5000
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 99
      memlock: -1
    ports:
      - "5001:5000"
    restart: unless-stopped