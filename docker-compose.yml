services:
  ui:
    build:
      context: ./ui_dsl
      dockerfile: Dockerfile
    container_name: procedure-ui
    environment:
      - LLM_SERVICE_URL=http://extractor:8001
      # con il simulatore: COBOT_SERVICE_URL=http://cobot-sim:5001 docker compose --profile sim up ui cobot-sim
      - COBOT_SERVICE_URL=${COBOT_SERVICE_URL:-http://host.docker.internal:5001}
      - MOVEIT_SERVICE_URL=http://moveit:5000
      # with the simulator: SIM_SERVICE_URL=http://cobot-sim:8080 (enables the contact-surface panel)
      - SIM_SERVICE_URL=${SIM_SERVICE_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./ui_dsl/src:/app/src
    ports:
      - "8000:8000"
    depends_on:
      - extractor

  extractor:
    build:
      context: ./extractor_pipeline
      dockerfile: Dockerfile
    container_name: procedure-extractor
    runtime: nvidia
    environment:
      - HF_HOME=/app/src/models/cache
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ./extractor_pipeline/src:/app/src
    ports:
      - "8001:8001"

  cobot:
    build:
      context: ./cobot
      dockerfile: Dockerfile
    container_name: procedure-cobot
    # libfranka's real-time FCI UDP traffic requires the host network.
    network_mode: host
    environment:
      - FRANKA_ROBOT_IP=${FRANKA_ROBOT_IP:-172.16.0.3}
      - HOST=0.0.0.0
      - PORT=5001
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 99
      memlock: -1
    restart: unless-stopped

  moveit:

    build:

      context: ./moveit_api

      dockerfile: Dockerfile

    container_name: procedure-moveit

    platform: linux/amd64

    environment:

      FRANKA_ROBOT_IP: ${FRANKA_ROBOT_IP:-172.16.0.3}

      USE_FAKE_HARDWARE: ${USE_FAKE_HARDWARE:-true}

      LOAD_GRIPPER: ${LOAD_GRIPPER:-true}

      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-10}

      # con il simulatore: ROBOT_STATE_URL=http://cobot-sim:8090/state (pianifica dallo stato del simulatore)

      ROBOT_STATE_URL: ${ROBOT_STATE_URL:-}

    privileged: true

    cap_add:

      - SYS_NICE

      - IPC_LOCK

    ulimits:

      rtprio: 99

      memlock: -1

    ports:

      - "5002:5000"

    healthcheck:

      test:

        [

          "CMD",

          "python3",

          "-c",

          "import urllib.request; urllib.request.urlopen('http://localhost:5000/ready', timeout=3)"

        ]

      interval: 10s

      timeout: 5s

      retries: 12

      start_period: 60s

    restart: unless-stopped

  # Simulatore Franka FR3 su ROS 2 (profilo "sim", non parte con un normale `up`).
  # Espone la stessa API del servizio cobot (sessioni, coda, Desk API finta) ma
  # i movimenti sono simulati e visualizzabili in 3D su http://localhost:8090 (visualizzatore locale).
  cobot-sim:
    profiles: ["sim"]
    build:
      context: .
      dockerfile: cobot_sim/Dockerfile
    container_name: procedure-cobot-sim
    environment:
      - PORT=5001
      - ROS_DOMAIN_ID=${SIM_ROS_DOMAIN_ID:-20}
      - SIM_SPEED=${SIM_SPEED:-1}
      - SIM_CONTACT_Z=${SIM_CONTACT_Z:-}
    ports:
      - "5001:5001"
      - "8090:8090"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
