<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSL for Cobot — Procedure DSL</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: monospace; max-width: 1200px; margin: 0 auto; padding: 0 24px 40px; color: #222; }

    nav { display: flex; border-bottom: 2px solid #333; margin-bottom: 24px; padding-top: 16px; }
    nav a { text-decoration: none; color: #666; padding: 8px 18px; font-family: monospace; font-size: 0.9rem; }
    nav a.active { color: #222; font-weight: bold; border-bottom: 3px solid #333; margin-bottom: -2px; }
    nav a:hover:not(.active) { color: #333; background: #f5f5f5; }

    h1 { font-size: 1.4rem; margin-bottom: 20px; }
    h2 { font-size: 1rem; margin-bottom: 12px; }
    h3 { font-size: 0.82rem; font-weight: bold; color: #444; margin-bottom: 8px;
         text-transform: uppercase; letter-spacing: 0.05em; }

    button { padding: 6px 14px; cursor: pointer; border: 1px solid #555;
             border-radius: 4px; background: #fff; font-family: monospace; font-size: 0.85rem; }
    button:hover:not(:disabled) { background: #eee; }
    button:disabled { opacity: 0.4; cursor: default; }
    button.primary { background: #333; color: #fff; border-color: #333; }
    button.primary:hover:not(:disabled) { background: #555; }
    button.success { background: #1a6630; color: #fff; border-color: #1a6630; }
    button.success:hover:not(:disabled) { background: #256b39; }
    button.danger { color: #c00; border-color: #daa; }
    button.danger:hover:not(:disabled) { background: #fff0f0; border-color: #c00; }
    button.sm { padding: 3px 9px; font-size: 0.78rem; }

    select, input[type=text], input[type=number] {
      font-family: monospace; font-size: 0.85rem;
      border: 1px solid #ccc; border-radius: 3px;
      padding: 4px 7px; background: #fff; color: #222;
    }
    select:focus, input:focus { outline: none; border-color: #555; }

    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
    .col { display: flex; flex-direction: column; gap: 3px; }
    label { font-size: 0.78rem; color: #666; }
    .sep { border: none; border-top: 1px solid #eee; margin: 14px 0; }
    .panel { border: 1px solid #ddd; border-radius: 6px; padding: 14px 16px; margin-bottom: 14px; }

    /* Badges */
    .badge { font-size: 0.72rem; border-radius: 10px; padding: 2px 9px;
             display: inline-block; white-space: nowrap; }
    .badge.human { background: #f0f0f0; border: 1px solid #ccc; color: #666; }
    .badge.cobot { background: #e8f4fd; border: 1px solid #90c6e8; color: #1a5a8a; }

    /* Steps table */
    #steps-table-wrap { overflow-x: auto; margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th { background: #f5f5f5; text-align: left; padding: 8px 10px;
         border-bottom: 2px solid #ccc; font-size: 0.78rem; font-weight: bold; }
    td { padding: 7px 10px; border-bottom: 1px solid #eee; vertical-align: top; }
    tr:hover td { background: #fafafa; }
    .td-num { font-weight: bold; color: #666; width: 34px; }
    .td-desc { max-width: 240px; font-size: 0.83rem; }
    .td-comp { font-size: 0.77rem; color: #777; max-width: 140px; }
    .td-tool { font-size: 0.77rem; max-width: 140px; }
    .td-tool-name { color: #555; font-weight: bold; }
    .td-tool-detail { color: #999; font-size: 0.72rem; margin-top: 1px; }
    .td-ops { max-width: 200px; }
    .td-act { width: 70px; }
    .op-tag { display: inline-block; background: #e8f4fd; border: 1px solid #90c6e8;
              border-radius: 3px; padding: 1px 5px; font-size: 0.7rem; color: #1a5a8a;
              margin: 1px 2px 1px 0; word-break: break-all; max-width: 220px;
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle; }

    /* Toolbar */
    .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
    .spacer { flex: 1; }

    /* Status dot */
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #ccc;
           flex-shrink: 0; display: inline-block; }
    .dot.online  { background: #2a9d2a; }
    .dot.busy    { background: #e07b00; }
    .dot.offline { background: #bbb; }

    /* Setup status bar */
    #setup-status-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 12px; background: #f4f4f4;
      border: 1px solid #ddd; border-radius: 4px;
      margin-bottom: 12px; font-size: 0.83rem;
    }
    #setup-status-text { flex: 1; }
    #setup-result {
      font-size: 0.78rem; margin-top: 8px; min-height: 1.2em;
      white-space: pre-wrap; word-break: break-word;
    }
    #setup-result.ok  { color: #1a6630; }
    #setup-result.err { color: #c00; }

    /* Msg */
    #msg { font-size: 0.82rem; padding: 7px 12px; border-radius: 4px;
           margin-bottom: 12px; display: none; }
    #msg.ok  { background: #e8f4ec; border: 1px solid #8bc89a; color: #1a6630; }
    #msg.err { background: #fdecea; border: 1px solid #e8a0a0; color: #c00; }

    /* Modal */
    .overlay { display: none; position: fixed; inset: 0;
               background: rgba(0,0,0,0.45); z-index: 1000;
               align-items: center; justify-content: center; }
    .overlay.open { display: flex; }
    .modal { background: #fff; border-radius: 8px; padding: 24px 28px;
             max-width: 560px; width: 94%; max-height: 82vh; overflow-y: auto;
             position: relative; box-shadow: 0 8px 32px rgba(0,0,0,0.18); }
    .modal-close { position: absolute; top: 12px; right: 14px;
                   background: none; border: none; font-size: 1.1rem;
                   cursor: pointer; color: #888; }
    .op-item { display: flex; align-items: flex-start; gap: 6px;
               padding: 5px 0; border-bottom: 1px solid #f0f0f0; }
    .op-item:last-child { border-bottom: none; }
    .op-item-str { flex: 1; font-size: 0.8rem; word-break: break-all; }
    .param-block { margin-bottom: 10px; }
    .param-block label { display: block; margin-bottom: 3px; }
    .param-hint { font-size: 0.71rem; color: #999; margin-top: 2px; }

    /* ── Execute overlay (full-screen) ── */
    #exec-overlay {
      display: none;
      position: fixed; inset: 0; z-index: 200;
      background: #fff;
      flex-direction: column;
      overflow: hidden;
    }
    #exec-overlay.open { display: flex; }

    /* Exec header */
    #exec-hdr {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 20px;
      border-bottom: 2px solid #333;
      background: #f4f4f4;
      flex-shrink: 0;
    }
    #exec-hdr-title { font-weight: bold; font-size: 1rem; }
    #exec-hdr-progress {
      font-size: 0.82rem; color: #666;
      background: #eee; border: 1px solid #ddd;
      border-radius: 10px; padding: 2px 10px;
    }

    /* Exec body */
    #exec-body { display: flex; flex: 1; overflow: hidden; }

    /* Step list sidebar */
    #exec-steplist {
      width: 230px; flex-shrink: 0;
      border-right: 1px solid #ddd;
      overflow-y: auto;
      background: #fafafa;
    }
    #exec-steplist-hdr {
      padding: 9px 14px;
      font-size: 0.75rem; font-weight: bold; color: #888;
      text-transform: uppercase; letter-spacing: 0.05em;
      border-bottom: 1px solid #eee;
      background: #f0f0f0;
      position: sticky; top: 0; z-index: 1;
    }
    .esli {
      padding: 9px 12px; cursor: pointer;
      border-bottom: 1px solid #f0f0f0;
      display: flex; flex-direction: column; gap: 3px;
    }
    .esli:hover { background: #f0f0f0; }
    .esli.active { background: #e8f4fd; border-left: 3px solid #1a5a8a; }
    .esli-top { display: flex; align-items: center; gap: 6px; }
    .esli-num {
      font-size: 0.72rem; font-weight: bold; color: #888;
      min-width: 22px;
    }
    .esli-desc {
      font-size: 0.78rem; color: #333;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      flex: 1;
    }
    .esli.active .esli-desc { color: #1a3a6a; }

    /* Exec main area */
    #exec-main {
      flex: 1; overflow-y: auto;
      padding: 24px 28px 40px;
    }

    /* Step card */
    .exec-card {
      border: 2px solid #ddd; border-radius: 10px;
      padding: 24px 28px; background: #fff;
      max-width: 760px;
    }
    .exec-step-meta { font-size: 0.75rem; color: #999; margin-bottom: 6px; }
    .exec-step-desc { font-size: 1.1rem; font-weight: bold; margin-bottom: 10px; line-height: 1.4; }
    .exec-step-comp { font-size: 0.8rem; color: #666; margin-bottom: 8px; }
    .exec-step-tool {
      font-size: 0.82rem; margin-bottom: 18px;
      background: #fffbf0; border: 1px solid #e8d96a;
      border-radius: 4px; padding: 5px 10px;
      display: inline-flex; align-items: center; gap: 6px;
    }

    .human-notice {
      background: #fffbea; border: 1px solid #e8d96a; border-radius: 6px;
      padding: 14px 18px; font-size: 0.9rem;
    }

    /* Ops list */
    .exec-ops-wrap { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .exec-op-item {
      border: 1px solid #e0e0e0; border-radius: 6px;
      overflow: hidden;
    }
    .exec-op-row {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; font-size: 0.83rem;
      background: #fafafa;
    }
    .exec-op-row:hover { background: #f4f4f4; }
    .op-status { min-width: 20px; text-align: center; font-size: 1rem; }
    .exec-op-str { flex: 1; word-break: break-all; font-size: 0.8rem; }

    /* Inline edit form */
    .exec-op-edit {
      padding: 12px 14px;
      border-top: 1px solid #e8e8e8;
      background: #f9f9ff;
    }
    .exec-op-edit .param-block { margin-bottom: 8px; }
    .exec-op-edit label { font-size: 0.75rem; color: #555; display: block; margin-bottom: 3px; }
    .exec-op-edit input { width: 100%; font-size: 0.82rem; }
    .exec-op-edit .param-hint { font-size: 0.69rem; color: #aaa; margin-top: 2px; }
    .exec-edit-actions { display: flex; gap: 6px; margin-top: 10px; }

    /* Exec nav */
    #exec-nav {
      display: flex; gap: 10px; justify-content: space-between;
      margin-top: 20px; max-width: 760px;
    }
    #exec-nav-right { display: flex; gap: 8px; }

    /* Jump selector */
    #exec-jump-wrap {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 20px; font-size: 0.82rem; max-width: 760px;
    }
  </style>
</head>
<body>

<nav>
  <a href="/">Extractor</a>
  <a href="/editor">Editor</a>
  <a href="/cobot">Cobot</a>
  <a href="/dsl-cobot" class="active">DSL Cobot</a>
  <a href="/dsl-manage">DSL Manage</a>
</nav>

<h1>DSL for Cobot</h1>
<div id="msg"></div>

<!-- ── Robot Setup ──────────────────────────────────────────────────────── -->
<div class="panel">
  <h3>Robot Setup</h3>

  <!-- Status bar -->
  <div id="setup-status-bar">
    <div class="dot offline" id="setup-dot"></div>
    <span id="setup-status-text">Checking cobot service…</span>
    <button class="sm" onclick="checkCobotStatus()" style="margin-left:auto;">Refresh</button>
  </div>

  <!-- Connection form -->
  <div class="row" style="flex-wrap:wrap">
    <div class="col">
      <label>Robot IP</label>
      <input type="text" id="s-ip" value="172.16.0.3" style="width:145px">
    </div>
    <div class="col">
      <label>Username</label>
      <input type="text" id="s-user" value="fixed_arm" style="width:115px">
    </div>
    <div class="col">
      <label>Password</label>
      <input type="password" id="s-pass" placeholder="password" style="width:115px">
    </div>
    <div class="col">
      <label>Owner <span style="color:#aaa;font-size:0.72rem">(token)</span></label>
      <input type="text" id="s-owner" value="franka-backend" style="width:130px">
    </div>
  </div>

  <div class="row" style="margin-top:10px;flex-wrap:wrap">
    <button class="success" onclick="setupPrepareAndConnect()">&#9889; Prepare &amp; Connect</button>
    <button class="primary" onclick="setupConnectDesk()">Connect Desk only</button>
    <button class="sm danger" onclick="setupDisconnect()">Disconnect</button>
  </div>
  <div id="setup-result"></div>
</div>

<!-- ── Load DSL ─────────────────────────────────────────────────────────── -->
<div class="panel">
  <h3>Load Procedure DSL</h3>
  <div class="row">
    <div class="col" style="flex:1; min-width:220px;">
      <label>Internal DSL file</label>
      <select id="dsl-select">
        <option value="">— select —</option>
      </select>
    </div>
    <button class="primary" onclick="loadDsl()" style="align-self:flex-end;">Load</button>
  </div>
  <div id="load-info" style="font-size:0.8rem; color:#666; margin-top:8px;"></div>
</div>

<!-- ── Steps table ──────────────────────────────────────────────────────── -->
<div id="steps-section" style="display:none;">
  <div class="toolbar">
    <span id="steps-title" style="font-weight:bold; font-size:0.95rem;"></span>
    <div class="spacer"></div>
    <button onclick="enterExecMode()" id="btn-run">&#9654; Run Procedure</button>
    <button class="primary" onclick="saveOps()">Save to DSL</button>
  </div>
  <div id="steps-table-wrap">
    <table>
      <thead>
        <tr>
          <th class="td-num">#</th>
          <th class="td-desc">Description</th>
          <th class="td-comp">Components</th>
          <th class="td-tool">Tool</th>
          <th class="td-ops">Cobot Operations</th>
          <th class="td-act">Edit</th>
        </tr>
      </thead>
      <tbody id="steps-tbody"></tbody>
    </table>
  </div>
</div>

<!-- ── Execute overlay (full-screen) ──────────────────────────────────── -->
<div id="exec-overlay">
  <!-- Header -->
  <div id="exec-hdr">
    <button onclick="exitExecMode()">&#8592; Back</button>
    <span id="exec-hdr-title">Procedure</span>
    <div class="spacer"></div>
    <span id="exec-hdr-progress" class="badge cobot" style="font-size:0.82rem; padding:3px 12px;"></span>
  </div>

  <!-- Body -->
  <div id="exec-body">

    <!-- Step list sidebar -->
    <div id="exec-steplist">
      <div id="exec-steplist-hdr">Steps</div>
      <div id="exec-steplist-items"></div>
    </div>

    <!-- Current step -->
    <div id="exec-main">

      <!-- Jump to step -->
      <div id="exec-jump-wrap">
        <label style="color:#888; font-size:0.78rem;">Jump to:</label>
        <select id="exec-jump-select" onchange="jumpToStep(parseInt(this.value))">
        </select>
        <span id="exec-msg" style="font-size:0.78rem; color:#2a6630; display:none;"></span>
      </div>

      <!-- Step card -->
      <div id="exec-card-wrap"></div>

      <!-- Navigation -->
      <div id="exec-nav">
        <button id="btn-exec-prev" onclick="execPrev()">&#8592; Previous</button>
        <div id="exec-nav-right">
          <button class="primary" id="btn-exec-next" onclick="execNext()">Next &#8594;</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ── Assign Modal ──────────────────────────────────────────────────────── -->
<div class="overlay" id="overlay">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">&#10005;</button>
    <h2 id="modal-title" style="margin-bottom:6px;">Assign Cobot Operations</h2>
    <div id="modal-desc" style="font-size:0.82rem; color:#666; margin-bottom:16px;"></div>

    <h3>Assigned Operations</h3>
    <div id="modal-op-list" style="margin-bottom:14px;"></div>

    <hr class="sep">
    <h3>Add Operation</h3>
    <div class="row" style="margin-bottom:8px;">
      <div class="col" style="flex:1;">
        <label>Function</label>
        <select id="func-select" onchange="onFuncChange()" style="width:100%;">
          <option value="">— select —</option>
        </select>
      </div>
    </div>
    <div id="func-desc" style="font-size:0.78rem; color:#888; margin-bottom:8px;"></div>
    <div id="param-inputs" style="margin-bottom:12px;"></div>
    <button class="primary" onclick="addOp()" id="add-op-btn" disabled>+ Add</button>

    <hr class="sep">
    <div style="text-align:right;">
      <button class="primary" onclick="closeModal()">Done</button>
    </div>
  </div>
</div>

<script>
// ── Robot Setup ────────────────────────────────────────────────────────────
async function cobotFetch(method, path, body) {
  const opts = { method, headers: {} };
  if (body !== undefined) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const r = await fetch('/cobot-proxy/' + path, opts);
  const data = await r.json().catch(() => ({}));
  return { ok: r.ok, data };
}

function setSetupResult(text, ok) {
  const el = document.getElementById('setup-result');
  el.textContent = text;
  el.className = ok ? 'ok' : 'err';
}

async function checkCobotStatus() {
  try {
    const { ok, data } = await cobotFetch('GET', 'health');
    const connected = data.connected ?? false;
    const busy = data.busy ?? false;
    document.getElementById('setup-dot').className =
      'dot ' + (connected ? (busy ? 'busy' : 'online') : 'offline');
    document.getElementById('setup-status-text').textContent = connected
      ? (busy ? 'Robot busy' : `Robot connected — ${data.robot_ip || ''} (${data.mode || ''})`)
      : 'Robot not connected';
  } catch(e) {
    document.getElementById('setup-dot').className = 'dot offline';
    document.getElementById('setup-status-text').textContent = 'Cobot service unreachable';
  }
}

function deskConnectBody() {
  return {
    robot_ip: document.getElementById('s-ip').value.trim(),
    username:  document.getElementById('s-user').value.trim(),
    password:  document.getElementById('s-pass').value,
    owner:     document.getElementById('s-owner').value.trim() || 'franka-backend',
  };
}

async function setupConnectDesk() {
  try {
    const { ok, data } = await cobotFetch('POST', 'api/desk/connect', deskConnectBody());
    setSetupResult(ok ? `Desk connected — ${data.robot_ip || ''}` : (data.error || 'Connect failed'), ok);
    checkCobotStatus();
  } catch(e) { setSetupResult(e.message, false); }
}

async function setupPrepareAndConnect() {
  setSetupResult('Connecting to Desk API…', true);
  try {
    const r1 = await cobotFetch('POST', 'api/desk/connect', deskConnectBody());
    if (!r1.ok) { setSetupResult(r1.data.error || 'Desk connect failed', false); return; }
    setSetupResult('Desk connected — unlocking joints, activating FCI, connecting robot…', true);
    const r2 = await cobotFetch('POST', 'api/desk/prepare-and-connect');
    setSetupResult(
      r2.ok ? 'Robot ready — joints unlocked, FCI active, pylibfranka connected'
             : (r2.data.error || 'Prepare failed'),
      r2.ok
    );
    checkCobotStatus();
  } catch(e) { setSetupResult(e.message, false); }
}

async function setupDisconnect() {
  try {
    await cobotFetch('POST', 'api/robot/disconnect');
    await cobotFetch('POST', 'api/desk/disconnect');
    setSetupResult('Disconnected', true);
    checkCobotStatus();
  } catch(e) { setSetupResult(e.message, false); }
}

// ── State ──────────────────────────────────────────────────────────────────
let currentFile = null;
let steps = [];
let stepOps = {};
let opReg = {};
let editStep = null;
let execIdx = 0;
let execEditingOp = null; // {stepNum, opIdx} currently showing inline edit form

// ── Boot ───────────────────────────────────────────────────────────────────
(async () => {
  checkCobotStatus();
  await loadOpRegistry();
  await loadDslList();
})();

async function loadOpRegistry() {
  try {
    const r = await fetch('/dsl-cobot/op-registry');
    opReg = await r.json();
    const sel = document.getElementById('func-select');
    for (const [name] of Object.entries(opReg)) {
      const o = document.createElement('option');
      o.value = name; o.textContent = name;
      sel.appendChild(o);
    }
  } catch(e) { console.error('registry load failed', e); }
}

async function loadDslList() {
  try {
    const r = await fetch('/dsl-cobot/list-dsl');
    const d = await r.json();
    const sel = document.getElementById('dsl-select');
    for (const f of (d.internal || [])) {
      const o = document.createElement('option');
      o.value = f; o.textContent = f;
      sel.appendChild(o);
    }
  } catch(e) { console.error('dsl list load failed', e); }
}

// ── Load DSL ──────────────────────────────────────────────────────────────
async function loadDsl() {
  const filename = document.getElementById('dsl-select').value;
  if (!filename) { showMsg('Select a DSL file first', 'err'); return; }
  try {
    const r = await fetch('/dsl-cobot/load-dsl', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ filename })
    });
    if (!r.ok) { showMsg((await r.json()).error || 'Load failed', 'err'); return; }
    const data = await r.json();
    currentFile = filename;
    steps = data.steps || [];

    stepOps = {};
    for (const s of steps) {
      stepOps[s.step_number] = (s.cobot_operations || [])
        .map(parseOpString).filter(Boolean);
    }

    document.getElementById('load-info').textContent =
      `${data.project_name} — ${steps.length} step${steps.length !== 1 ? 's' : ''} loaded`;
    document.getElementById('steps-title').textContent =
      `${data.project_name} (${steps.length} steps)`;

    renderTable();
    document.getElementById('steps-section').style.display = '';
    showMsg('', '');
  } catch(e) { showMsg('Error: ' + e.message, 'err'); }
}

// ── Table ─────────────────────────────────────────────────────────────────
function renderTable() {
  const tbody = document.getElementById('steps-tbody');
  tbody.innerHTML = '';
  for (const s of steps) {
    const tr = document.createElement('tr');
    tr.id = 'row-' + s.step_number;
    tr.innerHTML = `
      <td class="td-num">${s.step_number}</td>
      <td class="td-desc">${esc(s.description)}</td>
      <td class="td-comp">${esc((s.involved_components || []).join(', '))}</td>
      <td class="td-tool">${toolHtml(s)}</td>
      <td class="td-ops" id="ops-cell-${s.step_number}">${opsHtml(s.step_number)}</td>
      <td class="td-act"><button class="sm" onclick="openModal(${s.step_number})">Assign</button></td>
    `;
    tbody.appendChild(tr);
  }
}

function toolHtml(step) {
  if (!step.tool_type && !step.tool_name) return '<span style="color:#ccc">—</span>';
  const name = step.tool_name || step.tool_type || '';
  const detail = step.tool_detail || {};
  const detailStr = Object.entries(detail).map(([k, v]) => `${k}: ${v}`).join(', ');
  return `<div class="td-tool-name">${esc(name)}</div>` +
         (detailStr ? `<div class="td-tool-detail">${esc(detailStr)}</div>` : '');
}

function toolCardHtml(step) {
  if (!step.tool_type && !step.tool_name) return '';
  const name = step.tool_name || step.tool_type || '';
  const detail = step.tool_detail || {};
  const detailStr = Object.entries(detail).map(([k, v]) => `${k}: ${v}`).join(' · ');
  return `<div class="exec-step-tool">` +
    `<span style="font-size:0.72rem;color:#888;text-transform:uppercase;letter-spacing:0.04em;">Tool</span> ` +
    `<strong>${esc(name)}</strong>` +
    (detailStr ? ` <span style="color:#999;font-size:0.78rem;">(${esc(detailStr)})</span>` : '') +
    `</div>`;
}

function opsHtml(stepNum) {
  const ops = stepOps[stepNum] || [];
  if (!ops.length) return '<span class="badge human">Utente</span>';
  const tags = ops.map(op =>
    `<span class="op-tag" title="${esc(op.display)}">${esc(op.func)}(…)</span>`
  ).join('');
  return `<span class="badge cobot">${ops.length} op${ops.length > 1 ? 's' : ''}</span> ${tags}`;
}

function refreshOpsCell(stepNum) {
  const cell = document.getElementById('ops-cell-' + stepNum);
  if (cell) cell.innerHTML = opsHtml(stepNum);
}

// ── Save ──────────────────────────────────────────────────────────────────
async function saveOps() {
  if (!currentFile) { showMsg('No DSL loaded', 'err'); return; }
  const ops = {};
  for (const [num, list] of Object.entries(stepOps)) {
    ops[num] = list.map(op => op.display);
  }
  for (const s of steps) {
    if (!(s.step_number in ops)) ops[s.step_number] = [];
  }
  try {
    const r = await fetch('/dsl-cobot/save-cobot-ops', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ filename: currentFile, ops })
    });
    const d = await r.json();
    if (!r.ok) { showMsg(d.error || 'Save failed', 'err'); return; }
    showMsg(`Saved — internal DSL updated, external DSL regenerated`, 'ok');
  } catch(e) { showMsg('Save error: ' + e.message, 'err'); }
}

// ── Modal ─────────────────────────────────────────────────────────────────
function openModal(stepNum) {
  editStep = stepNum;
  const s = steps.find(x => x.step_number === stepNum);
  document.getElementById('modal-title').textContent = `Step ${stepNum} — Cobot Operations`;
  document.getElementById('modal-desc').textContent = s ? s.description : '';
  renderModalList();
  document.getElementById('func-select').value = '';
  document.getElementById('func-desc').textContent = '';
  document.getElementById('param-inputs').innerHTML = '';
  document.getElementById('add-op-btn').disabled = true;
  document.getElementById('overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  if (editStep !== null) refreshOpsCell(editStep);
  editStep = null;
}

function renderModalList() {
  const ops = stepOps[editStep] || [];
  const el = document.getElementById('modal-op-list');
  if (!ops.length) {
    el.innerHTML = '<div style="font-size:0.82rem;color:#aaa;font-style:italic;">No operations — step will be performed by human operator.</div>';
    return;
  }
  el.innerHTML = ops.map((op, i) => `
    <div class="op-item">
      <span class="op-item-str">${esc(op.display)}</span>
      <button class="sm danger" onclick="removeOp(${i})">✕</button>
    </div>
  `).join('');
}

function removeOp(idx) {
  if (!stepOps[editStep]) return;
  stepOps[editStep].splice(idx, 1);
  renderModalList();
}

function onFuncChange() {
  const func = document.getElementById('func-select').value;
  document.getElementById('add-op-btn').disabled = !func;
  if (!func) {
    document.getElementById('func-desc').textContent = '';
    document.getElementById('param-inputs').innerHTML = '';
    return;
  }
  const meta = opReg[func];
  document.getElementById('func-desc').textContent = meta.description || '';
  renderParamInputs(meta.params || {});
}

function renderParamInputs(params) {
  const c = document.getElementById('param-inputs');
  const entries = Object.entries(params);
  if (!entries.length) {
    c.innerHTML = '<div style="font-size:0.78rem;color:#aaa;">No parameters required.</div>';
    return;
  }
  c.innerHTML = entries.map(([key, meta]) => {
    const isArr = meta.type && meta.type.startsWith('array');
    const len = meta.type === 'array7' ? 7 : meta.type === 'array6' ? 6 : null;
    const placeholder = isArr
      ? (len ? Array(len).fill('0').join(', ') : '0, 0, 0')
      : (meta.default !== undefined ? String(meta.default) : '');
    const req = meta.required ? ' <span style="color:#c00">*</span>' : '';
    const hint = meta.description + (len ? ` (${len} values, comma-separated)` : '');
    return `
      <div class="param-block">
        <label>${key}${req}</label>
        <input type="text" id="pi-${key}" placeholder="${placeholder}" style="width:100%;">
        <div class="param-hint">${esc(hint)}</div>
      </div>
    `;
  }).join('');
}

function addOp() {
  const func = document.getElementById('func-select').value;
  if (!func || editStep === null) return;
  const meta = opReg[func];
  const params = {};

  for (const [key, pmeta] of Object.entries(meta.params || {})) {
    const inp = document.getElementById('pi-' + key);
    if (!inp) continue;
    const v = inp.value.trim();
    if (!v) {
      if (pmeta.required) { showMsg(`Parameter "${key}" is required`, 'err'); return; }
      if (pmeta.default !== undefined) params[key] = pmeta.default;
      continue;
    }
    if (pmeta.type && pmeta.type.startsWith('array')) {
      try { params[key] = JSON.parse('[' + v + ']'); }
      catch { showMsg(`Invalid array for "${key}": use comma-separated numbers`, 'err'); return; }
    } else {
      const n = parseFloat(v);
      params[key] = isNaN(n) ? v : n;
    }
  }

  const display = fmtOpStr(func, params);
  if (!stepOps[editStep]) stepOps[editStep] = [];
  stepOps[editStep].push({func, params, display});
  renderModalList();
  showMsg('', '');
  document.getElementById('func-select').value = '';
  onFuncChange();
}

// ── Execute Mode ──────────────────────────────────────────────────────────
function enterExecMode() {
  if (!steps.length) return;
  execIdx = 0;
  execEditingOp = null;

  // Populate jump selector
  const sel = document.getElementById('exec-jump-select');
  sel.innerHTML = '';
  steps.forEach((s, i) => {
    const o = document.createElement('option');
    o.value = i;
    o.textContent = `Step ${s.step_number}: ${s.description.slice(0, 50)}`;
    sel.appendChild(o);
  });

  document.getElementById('exec-overlay').classList.add('open');
  renderExecStepList();
  renderExecStep();
}

function exitExecMode() {
  document.getElementById('exec-overlay').classList.remove('open');
  execEditingOp = null;
}

function jumpToStep(idx) {
  if (idx < 0 || idx >= steps.length) return;
  execIdx = idx;
  execEditingOp = null;
  document.getElementById('exec-jump-select').value = idx;
  renderExecStepList();
  renderExecStep();
}

function execNext() {
  if (execIdx < steps.length - 1) {
    jumpToStep(execIdx + 1);
  } else {
    showExecMsg('Procedura completata!');
    setTimeout(() => exitExecMode(), 1200);
  }
}

function execPrev() {
  if (execIdx > 0) jumpToStep(execIdx - 1);
}

// ── Render step list sidebar ───────────────────────────────────────────────
function renderExecStepList() {
  const container = document.getElementById('exec-steplist-items');
  container.innerHTML = '';
  steps.forEach((s, i) => {
    const ops = stepOps[s.step_number] || [];
    const isActive = i === execIdx;
    const hasOps = ops.length > 0;
    const div = document.createElement('div');
    div.className = 'esli' + (isActive ? ' active' : '');
    div.onclick = () => jumpToStep(i);
    div.innerHTML = `
      <div class="esli-top">
        <span class="esli-num">${s.step_number}</span>
        <span class="badge ${hasOps ? 'cobot' : 'human'}" style="font-size:0.65rem; padding:1px 6px;">
          ${hasOps ? ops.length + ' op' + (ops.length > 1 ? 's' : '') : 'Human'}
        </span>
      </div>
      <div class="esli-desc">${esc(s.description)}</div>
    `;
    container.appendChild(div);
    if (isActive) div.scrollIntoView({ block: 'nearest' });
  });
}

// ── Render current step card ───────────────────────────────────────────────
function renderExecStep() {
  const step = steps[execIdx];
  const ops = stepOps[step.step_number] || [];
  const total = steps.length;

  // Update header
  const projName = currentFile ? currentFile.replace(/\.json$/, '') : 'Procedure';
  document.getElementById('exec-hdr-title').textContent = projName;
  document.getElementById('exec-hdr-progress').textContent =
    `Step ${execIdx + 1} / ${total}`;

  // Update jump selector
  document.getElementById('exec-jump-select').value = execIdx;

  // Update nav buttons
  document.getElementById('btn-exec-prev').disabled = execIdx === 0;
  const nextBtn = document.getElementById('btn-exec-next');
  nextBtn.textContent = execIdx === total - 1 ? 'Finish ✓' : 'Next →';

  let html = `
    <div class="exec-card">
      <div class="exec-step-meta">Step ${step.step_number} of ${total}</div>
      <div class="exec-step-desc">${esc(step.description)}</div>
      <div class="exec-step-comp">Components: ${esc((step.involved_components || []).join(', '))}</div>
      ${toolCardHtml(step)}
  `;

  if (!ops.length) {
    html += `
      <div class="human-notice">
        &#128100; <strong>Operazione riservata all'operatore umano.</strong><br>
        Completa manualmente questo step, poi premi <em>Next</em> per continuare.
      </div>
    `;
  } else {
    html += `<div class="exec-ops-wrap">`;
    ops.forEach((op, i) => {
      const isEditing = execEditingOp &&
        execEditingOp.stepNum === step.step_number &&
        execEditingOp.opIdx === i;

      html += `
        <div class="exec-op-item">
          <div class="exec-op-row">
            <span class="op-status" id="es-${i}">&#9675;</span>
            <span class="exec-op-str">${esc(op.display)}</span>
            <button class="sm" onclick="toggleEditOp(${step.step_number}, ${i})">
              ${isEditing ? 'Cancel' : 'Edit params'}
            </button>
            <button class="sm primary" id="eb-${i}"
                    onclick="execOneOp(${step.step_number}, ${i})">Execute</button>
          </div>
      `;

      if (isEditing) {
        const meta = opReg[op.func];
        const paramEntries = Object.entries((meta && meta.params) || {});
        html += `<div class="exec-op-edit">`;
        if (!paramEntries.length) {
          html += `<div style="font-size:0.78rem;color:#aaa;">No parameters for this function.</div>`;
        } else {
          paramEntries.forEach(([key, pmeta]) => {
            const curVal = op.params[key];
            const displayVal = curVal !== undefined
              ? (Array.isArray(curVal) ? curVal.join(', ') : String(curVal))
              : '';
            const hint = pmeta.description || '';
            html += `
              <div class="param-block">
                <label>${esc(key)}</label>
                <input type="text" id="epi-${i}-${esc(key)}"
                       value="${esc(displayVal)}" placeholder="${esc(hint)}">
                <div class="param-hint">${esc(hint)}</div>
              </div>
            `;
          });
        }
        html += `
          <div class="exec-edit-actions">
            <button class="sm primary" onclick="applyOpEdit(${step.step_number}, ${i})">Apply</button>
            <button class="sm" onclick="toggleEditOp(${step.step_number}, ${i})">Cancel</button>
          </div>
        </div>`;
      }

      html += `</div>`; // exec-op-item
    });
    html += `</div>`; // exec-ops-wrap

    html += `
      <div>
        <button class="success" onclick="execAllOps(${step.step_number})">&#9654; Execute All</button>
      </div>
    `;
  }

  html += `</div>`; // exec-card
  document.getElementById('exec-card-wrap').innerHTML = html;
}

// ── Inline param editing ───────────────────────────────────────────────────
function toggleEditOp(stepNum, opIdx) {
  if (execEditingOp &&
      execEditingOp.stepNum === stepNum &&
      execEditingOp.opIdx === opIdx) {
    execEditingOp = null;
  } else {
    execEditingOp = { stepNum, opIdx };
  }
  renderExecStep();
}

function applyOpEdit(stepNum, opIdx) {
  const op = (stepOps[stepNum] || [])[opIdx];
  if (!op) return;
  const meta = opReg[op.func];
  const newParams = {};

  for (const [key, pmeta] of Object.entries((meta && meta.params) || {})) {
    const inp = document.getElementById(`epi-${opIdx}-${key}`);
    if (!inp) continue;
    const v = inp.value.trim();
    if (!v) {
      if (pmeta.default !== undefined) newParams[key] = pmeta.default;
      continue;
    }
    if (pmeta.type && pmeta.type.startsWith('array')) {
      try { newParams[key] = JSON.parse('[' + v + ']'); }
      catch { showExecMsg('Invalid array for "' + key + '" — use comma-separated numbers'); return; }
    } else {
      const n = parseFloat(v);
      newParams[key] = isNaN(n) ? v : n;
    }
  }

  op.params = newParams;
  op.display = fmtOpStr(op.func, newParams);
  execEditingOp = null;
  renderExecStep();
  showExecMsg('Parameters updated');
}

function showExecMsg(text) {
  const el = document.getElementById('exec-msg');
  el.textContent = text;
  el.style.display = '';
  setTimeout(() => { el.style.display = 'none'; }, 2500);
}

// ── Execute ops ────────────────────────────────────────────────────────────
async function execOneOp(stepNum, opIdx) {
  const op = (stepOps[stepNum] || [])[opIdx];
  if (!op) return;
  const btn = document.getElementById('eb-' + opIdx);
  const status = document.getElementById('es-' + opIdx);
  if (btn) btn.disabled = true;
  if (status) status.textContent = '⏳';
  try {
    const r = await fetch('/dsl-cobot/execute-op', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({func: op.func, params: op.params})
    });
    const d = await r.json();
    if (r.ok) {
      if (status) { status.textContent = '✓'; status.style.color = '#2a9d2a'; }
    } else {
      if (status) { status.textContent = '✗'; status.style.color = '#c00'; }
      showExecMsg(d.error || 'Execution failed');
      if (btn) btn.disabled = false;
    }
  } catch(e) {
    if (status) { status.textContent = '✗'; status.style.color = '#c00'; }
    showExecMsg(e.message);
    if (btn) btn.disabled = false;
  }
}

async function execAllOps(stepNum) {
  const ops = stepOps[stepNum] || [];
  for (let i = 0; i < ops.length; i++) await execOneOp(stepNum, i);
}

// ── Op string helpers ──────────────────────────────────────────────────────
function parseOpString(s) {
  const m = String(s).match(/^(\w+)\(([\s\S]*)\)$/);
  if (!m) return null;
  const func = m[1];
  const paramsStr = m[2].trim();
  const params = {};
  if (paramsStr) {
    for (const part of splitOnComma(paramsStr)) {
      const eq = part.indexOf('=');
      if (eq < 0) continue;
      const key = part.slice(0, eq).trim();
      const val = part.slice(eq + 1).trim();
      try { params[key] = JSON.parse(val); } catch { params[key] = val; }
    }
  }
  return {func, params, display: s};
}

function fmtOpStr(func, params) {
  if (!params || !Object.keys(params).length) return `${func}()`;
  const parts = Object.entries(params).map(([k, v]) => `${k}=${JSON.stringify(v)}`);
  return `${func}(${parts.join(', ')})`;
}

function splitOnComma(str) {
  const parts = []; let depth = 0, cur = '';
  for (const c of str) {
    if ('([{'.includes(c)) { depth++; cur += c; }
    else if (')]}'.includes(c)) { depth--; cur += c; }
    else if (c === ',' && depth === 0) { parts.push(cur.trim()); cur = ''; }
    else cur += c;
  }
  if (cur.trim()) parts.push(cur.trim());
  return parts;
}

function esc(s) {
  return String(s || '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function showMsg(text, type) {
  const el = document.getElementById('msg');
  if (!text) { el.style.display = 'none'; return; }
  el.className = type; el.textContent = text; el.style.display = 'block';
}
</script>
